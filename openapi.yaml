# Contrato da API REST do BFF, no formato OpenAPI 3. É a fonte de verdade
# do que o app recebe: os nomes dos campos, os tipos, o que pode ser null e
# os erros de cada rota. O teste de contrato (internal/adapter/http/
# contract_test.go) confere respostas reais contra este arquivo, e o
# "make swagger" gera dele a página docs/swagger.html para ler no navegador.
#
# Estrutura: "paths" lista as rotas; "components" guarda as peças
# reutilizadas (parâmetros, cabeçalhos, respostas de erro e schemas), citadas
# nas rotas com "$ref".
openapi: 3.0.3
info:
  title: Passarim BFF
  version: 1.1.0
  description: |
    API REST do Passarim (catálogo de aves do Brasil). Somente leitura.
    Erros seguem o RFC 9457 (`application/problem+json`) com um `code` estável.
servers:
  - url: /
tags:
  - name: catalog
    description: Catálogo de aves
  - name: operational
    description: Saúde do serviço (não passam pelo balanceador público)
paths:
  # Usada pela tela Explorar do app: a grade de espécies, com busca, filtros e
  # paginação por cursor.
  /v1/species:
    get:
      tags: [catalog]
      operationId: listSpecies
      summary: Lista de espécies (tela Explorar)
      description: Busca e filtros. Uma busca com `q` nunca é cacheada no servidor.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Biome'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Audience'
        - $ref: '#/components/parameters/PrimaryBiome'
      responses:
        '200':
          description: Página de espécies
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Cache: { $ref: '#/components/headers/XCache' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeciesPage' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # Usada pela tela de detalhe de uma espécie.
  /v1/species/{id}:
    get:
      tags: [catalog]
      operationId: getSpecies
      summary: Detalhe de uma espécie
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,80}$' }
      responses:
        '200':
          description: Espécie completa
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Cache: { $ref: '#/components/headers/XCache' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Species' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '404': { $ref: '#/components/responses/SpeciesNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # Usada pela folha de filtros do Explorar: biomas e UFs com contagem.
  /v1/filters:
    get:
      tags: [catalog]
      operationId: listFilters
      summary: Biomas, estados e biomas principais com contagem de espécies
      parameters:
        - $ref: '#/components/parameters/Audience'
      responses:
        '200':
          description: Filtros disponíveis (os `code` valem como `biome` e `state` na lista)
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Cache: { $ref: '#/components/headers/XCache' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Filters' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # Usada pelo card "Ave do dia" das duas jornadas (frente B). A ave troca à
  # meia-noite de São Paulo, e o max-age vai só até essa meia-noite.
  /v1/featured:
    get:
      tags: [catalog]
      operationId: getFeatured
      summary: A "Ave do dia"
      description: |
        A mesma ave o dia todo, para todos, em rodízio sem repetição. A data
        é a de hoje no fuso de São Paulo, calculada pelo servidor. O
        `Cache-Control` traz `max-age` com os segundos até a próxima
        meia-noite de São Paulo (no mínimo 1).
      responses:
        '200':
          description: A ave do dia
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Cache: { $ref: '#/components/headers/XCache' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Featured' }
        '404': { $ref: '#/components/responses/FeaturedNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # Usadas pelo Docker (healthz) e pelo Traefik (readyz), nunca pelo app.
  /healthz:
    get:
      tags: [operational]
      operationId: healthz
      summary: Liveness (o processo está vivo)
      responses:
        '200':
          description: Vivo
          content:
            text/plain:
              schema: { type: string }
  /readyz:
    get:
      tags: [operational]
      operationId: readyz
      summary: Readiness (usado pelo Traefik; não depende do catalog nem do Redis)
      responses:
        '200':
          description: Pronto
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Em desligamento
          content:
            text/plain:
              schema: { type: string }
components:
  # Parâmetros de busca da lista, com os limites que o domínio valida.
  parameters:
    Q:
      name: q
      in: query
      description: Busca por nome popular ou científico (até 100 caracteres).
      schema: { type: string, maxLength: 100 }
    Biome:
      name: biome
      in: query
      schema: { $ref: '#/components/schemas/BiomeCode' }
    State:
      name: state
      in: query
      description: UF (aceita minúsculas; a resposta usa sempre maiúsculas).
      schema: { $ref: '#/components/schemas/StateCode' }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `nextCursor`.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Audience:
      name: audience
      in: query
      description: Jornada. `kids` traz só as aves com conteúdo Kids.
      schema: { type: string, enum: [adult, kids], default: adult }
    PrimaryBiome:
      name: primaryBiome
      in: query
      description: Bioma principal, o "mundo" da ave no Kids (diferente de `biome`, que vale para qualquer bioma da ave).
      schema: { $ref: '#/components/schemas/BiomeCode' }
  # Cabeçalhos que as respostas trazem.
  headers:
    XRequestId:
      description: Identificador da requisição (o mesmo que aparece nos logs).
      schema: { type: string }
    XCache:
      description: Origem do dado.
      schema: { type: string, enum: [hit, miss, stale] }
    CacheControl:
      schema: { type: string }
  # Respostas de erro reutilizadas, todas em problem+json.
  responses:
    InvalidParameter:
      description: Parâmetro inválido
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SpeciesNotFound:
      description: Espécie inexistente (`SPECIES_NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    FeaturedNotFound:
      description: Nenhuma ave elegível para a "Ave do dia" (`FEATURED_NOT_FOUND`); o app esconde o card
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Rota inexistente (`NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MethodNotAllowed:
      description: Só GET e HEAD (`METHOD_NOT_ALLOWED`)
      headers:
        Allow:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Muitas requisições (`RATE_LIMITED`)
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Internal:
      description: Erro interno (`INTERNAL`); sem detalhes técnicos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Catalog indisponível e sem dado em cache (`SERVICE_UNAVAILABLE`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  # Formatos do corpo das respostas. "nullable: true" marca os campos que
  # podem vir null, e o app os trata como opcionais.
  schemas:
    BiomeCode:
      type: string
      enum: [amazonia, mata_atlantica, cerrado, caatinga, pantanal, pampa]
    StateCode:
      type: string
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
    Label:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    ConservationStatus:
      type: object
      required: [code, label]
      properties:
        code: { type: string, enum: [LC, NT, VU, EN, CR, EW, EX, DD] }
        label: { type: string }
    Credit:
      type: object
      required: [author, license, source, sourceUrl]
      properties:
        author: { type: string }
        license: { type: string }
        source: { type: string }
        sourceUrl: { type: string }
    SpeciesSummary:
      type: object
      required: [id, commonName, scientificName, thumbnailUrl, conservationStatus, primaryBiome]
      properties:
        id: { type: string }
        commonName: { type: string }
        scientificName: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        conservationStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ConservationStatus'
        primaryBiome: { $ref: '#/components/schemas/PrimaryBiome' }
    SpeciesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SpeciesSummary' }
        nextCursor: { type: string, nullable: true }
    Fact:
      type: object
      required: [text, source]
      properties:
        text: { type: string }
        source: { type: string }
    Photo:
      type: object
      required: [thumbUrl, mediumUrl, largeUrl, width, height, credit]
      properties:
        thumbUrl: { type: string, nullable: true }
        mediumUrl: { type: string, nullable: true }
        largeUrl: { type: string, nullable: true }
        width: { type: integer }
        height: { type: integer }
        credit: { $ref: '#/components/schemas/Credit' }
    PrimaryBiome:
      type: string
      nullable: true
      description: O "mundo" da ave no Kids; null quando a ave ainda não tem.
      enum: [amazonia, mata_atlantica, cerrado, caatinga, pantanal, pampa, null]
    Audio:
      type: object
      required: [url, durationMs, credit, peaks]
      properties:
        url: { type: string }
        durationMs: { type: integer }
        credit: { $ref: '#/components/schemas/Credit' }
        peaks:
          type: array
          description: Os 64 picos da forma de onda, de 0 a 1; vazio quando ainda não foram calculados.
          maxItems: 64
          items: { type: number, minimum: 0, maximum: 1 }
    KidsFact:
      type: object
      required: [text]
      properties:
        text: { type: string }
    Kids:
      type: object
      description: Conteúdo para crianças, sem nenhum link.
      required: [description, facts, didYouKnow]
      properties:
        description: { type: string }
        facts:
          type: array
          items: { $ref: '#/components/schemas/KidsFact' }
        didYouKnow: { type: string }
    Cluster:
      type: object
      required: [lat, lng, count, precision]
      properties:
        lat: { type: number }
        lng: { type: number }
        count: { type: integer }
        precision: { type: number }
    WhereToFind:
      type: object
      required: [states, biomes, clusters]
      properties:
        states:
          type: array
          items: { $ref: '#/components/schemas/StateCode' }
        biomes:
          type: array
          items: { $ref: '#/components/schemas/BiomeCode' }
        clusters:
          type: array
          items: { $ref: '#/components/schemas/Cluster' }
    Species:
      type: object
      required: [id, commonName, scientificName, family, conservationStatus, sizeCm, diet, description, descriptionCredit, facts, chips, photos, audio, whereToFind, primaryBiome, kids]
      properties:
        id: { type: string }
        commonName: { type: string }
        scientificName: { type: string }
        family: { type: string }
        conservationStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ConservationStatus'
        sizeCm: { type: integer, nullable: true }
        diet: { type: string, nullable: true, description: Texto livre (não é uma categoria rotulada). }
        description: { type: string }
        descriptionCredit: { $ref: '#/components/schemas/Credit' }
        facts:
          type: array
          items: { $ref: '#/components/schemas/Fact' }
        chips:
          type: array
          description: Biomas da espécie, rotulados em português.
          items: { $ref: '#/components/schemas/Label' }
        photos:
          type: array
          description: A primeira é a principal.
          items: { $ref: '#/components/schemas/Photo' }
        audio:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Audio'
        whereToFind: { $ref: '#/components/schemas/WhereToFind' }
        primaryBiome: { $ref: '#/components/schemas/PrimaryBiome' }
        kids:
          nullable: true
          description: null quando a ave ainda não tem conteúdo Kids (e não aparece na jornada Kids).
          allOf:
            - $ref: '#/components/schemas/Kids'
    BiomeCount:
      type: object
      required: [code, label, speciesCount]
      properties:
        code: { $ref: '#/components/schemas/BiomeCode' }
        label: { type: string }
        speciesCount: { type: integer }
    StateCount:
      type: object
      required: [code, speciesCount]
      properties:
        code: { $ref: '#/components/schemas/StateCode' }
        speciesCount: { type: integer }
    Filters:
      type: object
      required: [biomes, states, primaryBiomes]
      properties:
        biomes:
          type: array
          items: { $ref: '#/components/schemas/BiomeCount' }
        states:
          type: array
          items: { $ref: '#/components/schemas/StateCount' }
        primaryBiomes:
          type: array
          description: Contagem por bioma principal ("mundo" do Kids), no formato de `biomes`.
          items: { $ref: '#/components/schemas/BiomeCount' }
    Featured:
      type: object
      required: [date, species, audio]
      properties:
        date: { type: string, format: date, description: 'Data da ave (AAAA-MM-DD, fuso de São Paulo).' }
        species: { $ref: '#/components/schemas/SpeciesSummary' }
        audio:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Audio'
    FieldError:
      type: object
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
    Problem:
      type: object
      description: Erro no formato do RFC 9457.
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, example: 'urn:passarim:problem:species-not-found' }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [INVALID_PARAMETER, SPECIES_NOT_FOUND, FEATURED_NOT_FOUND, NOT_FOUND, METHOD_NOT_ALLOWED, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL]
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
