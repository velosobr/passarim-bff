# CI do BFF: roda a cada push na main e a cada pull request. São jobs
# independentes, que o GitHub Actions executa em paralelo: testes, lint,
# segurança e, nas branches de comentários, a verificação "só comentários".

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Testes e verificação de vulnerabilidades conhecidas nas dependências.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # -race detecta acesso concorrente perigoso. Os testes do cache usam Redis via Docker
      # (já instalado nos runners). Inclui o teste de contrato contra o openapi.yaml.
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Lint: o golangci-lint junta vários verificadores, configurados no
  # .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # golangci-lint inclui o gosec (segurança) configurado em .golangci.yml.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  # Segurança: o gitleaks procura segredos no histórico do git, e o Trivy
  # procura vulnerabilidades na imagem Docker final.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build da imagem
        run: docker build -t passarim-bff:ci .
      # Trivy falha em vulnerabilidade ALTA/CRÍTICA com correção disponível.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passarim-bff:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Frente 0 do Passarim: nas branches que só comentam o código, garante que
  # nenhuma linha de código mudou (scripts/check-comment-only.sh).
  comentarios:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'docs/comentarios-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro é necessário para comparar com a base do PR.
          fetch-depth: 0
      - run: bash scripts/check-comment-only_test.sh
      - run: bash scripts/check-comment-only.sh origin/${{ github.base_ref }}
